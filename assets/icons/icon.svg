<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Base -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" />
  <!-- Clock Outer Ring -->
  <circle cx="64" cy="64" r="42" stroke="#F8FAFC" stroke-width="5" opacity="0.92" />
  <!-- Cardinal Hour Ticks -->
  <line x1="64" y1="27" x2="64" y2="33" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="101" y1="64" x2="95" y2="64" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="64" y1="101" x2="64" y2="95" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="27" y1="64" x2="33" y2="64" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
  <!-- Hour Hand (pointing ~10 o'clock) -->
  <line x1="64" y1="64" x2="46" y2="52" stroke="#F8FAFC" stroke-width="5.5" stroke-linecap="round" />
  <!-- Minute Hand (pointing ~2 o'clock) -->
  <line x1="64" y1="64" x2="86" y2="44" stroke="#F8FAFC" stroke-width="4.5" stroke-linecap="round" />
  <!-- Second Hand (pointing ~6:35, accent red) -->
  <line x1="67" y1="57" x2="54" y2="90" stroke="#EF4444" stroke-width="2.75" stroke-linecap="round" />
  <!-- Center Pivot Cap -->
  <circle cx="64" cy="64" r="4.5" fill="#EF4444" />
  <circle cx="64" cy="64" r="2" fill="#F8FAFC" />
</svg>
