<!DOCTYPE html>
<html lang="en" data-theme="dark" data-palette="slate" data-kind="color">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Clocks</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell" id="app-shell">
    <!-- Top Header: Brand + Mode Checkboxes + Dark/Light Toggle -->
    <header class="app-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" />
          <line x1="12" y1="12" x2="12" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <line x1="12" y1="12" x2="16" y2="12" stroke="var(--accent-primary)" stroke-width="2" stroke-linecap="round" />
          <circle cx="12" cy="12" r="1.5" fill="var(--accent-primary)" />
        </svg>
        <h1 class="brand-title">World Clocks</h1>
      </div>

      <div class="header-controls">
        <!-- Mode Checkboxes (At least one always selected) -->
        <div class="mode-selector" role="group" aria-label="Clock display modes">
          <label class="mode-checkbox-label" id="label-analog" title="Show analog clock">
            <input type="checkbox" id="chk-analog" checked />
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span class="mode-text">Analog</span>
          </label>
          <label class="mode-checkbox-label" id="label-digital" title="Show digital clock">
            <input type="checkbox" id="chk-digital" checked />
            <span class="custom-checkbox" aria-hidden="true"></span>
            <span class="mode-text">Digital</span>
          </label>
        </div>

        <!-- Dark / Light Theme Toggle Button -->
        <button
          type="button"
          id="btn-theme-toggle"
          class="icon-btn theme-toggle-btn"
          aria-label="Toggle dark or light mode"
          title="Switch Dark / Light mode"
        >
          <!-- Sun icon (shown in dark mode to switch to light) -->
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.9" />
            <path d="M12 2.5V5M12 19V21.5M4.22 4.22L5.99 5.99M18.01 18.01L19.78 19.78M2.5 12H5M19 12H21.5M4.22 19.78L5.99 18.01M18.01 5.99L19.78 4.22" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <!-- Moon icon (shown in light mode to switch to dark) -->
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M20.2 14.6A8.2 8.2 0 0 1 9.4 3.8a8.2 8.2 0 1 0 10.8 10.8Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- Appearance Settings (themes + fonts) -->
        <button
          type="button"
          id="btn-settings"
          class="icon-btn"
          aria-label="Theme and font settings"
          aria-expanded="false"
          aria-controls="settings-panel"
          title="Themes & fonts"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <circle cx="7.5" cy="11.5" r="1.4" fill="currentColor" />
            <circle cx="10.5" cy="7.5" r="1.4" fill="currentColor" />
            <circle cx="15.5" cy="8" r="1.4" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Appearance Settings Panel (replaces clock view while open) -->
    <section id="settings-panel" class="settings-panel hidden-scroll hidden" aria-label="Appearance settings">
      <div class="settings-head">
        <div class="settings-head-text">
          <span class="settings-title">Appearance</span>
          <span id="theme-active-name" class="settings-active"></span>
        </div>
        <button type="button" id="btn-settings-done" class="settings-done-btn">Done</button>
      </div>

      <h2 class="settings-section-title">Colour Themes</h2>
      <div id="color-themes" class="color-grid" role="radiogroup" aria-label="Colour themes"></div>

      <h2 class="settings-section-title">Fandom Themes</h2>
      <div id="fandom-themes" class="fandom-grid" role="radiogroup" aria-label="Fandom themes"></div>

      <h2 class="settings-section-title">Clock Font</h2>
      <div id="font-options" class="font-grid" role="radiogroup" aria-label="Clock fonts"></div>
    </section>

    <!-- Search Bar + Side Action Button (+ or red ×) -->
    <section class="search-section" aria-label="Add or remove world clocks">
      <div class="search-bar-row">
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="6.8" stroke="currentColor" stroke-width="1.9" />
            <line x1="16.2" y1="16.2" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <input
            type="text"
            id="search-input"
            class="search-input"
            placeholder="Search city or timezone..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Search city or timezone"
            aria-expanded="false"
            aria-controls="search-dropdown"
          />
        </div>
        <button
          type="button"
          id="btn-search-side"
          class="search-side-btn is-add"
          aria-label="Add or manage clock"
          title="Search & add clock"
        >
          <span class="side-btn-glyph" aria-hidden="true">+</span>
        </button>
      </div>

      <!-- Search Results Dropdown (hidden scrollbar) -->
      <div id="search-dropdown" class="search-dropdown hidden" role="listbox" aria-label="Matching cities">
        <ul id="search-results" class="search-results-list hidden-scroll"></ul>
      </div>
    </section>

    <!-- Subtle Toast / Constraint Notice -->
    <div id="status-toast" class="status-toast hidden" role="status" aria-live="polite"></div>

    <!-- Setup Clocks List / Responsive Analog Grid (hidden scrollbar) -->
    <main id="clocks-viewport" class="clocks-viewport hidden-scroll" aria-label="Configured world clocks">
      <div id="clocks-list" class="clocks-list"></div>
    </main>
  </div>

  <script src="timezones.js"></script>
  <script src="themes.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
